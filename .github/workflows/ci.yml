# Intégration continue : lance les tests à chaque push et chaque pull request.

name: CI

# Quand la CI se lance
on:
  push:
  pull_request:

jobs:
  tests:
    # Machine Linux vierge fournie par GitHub (sans .env ni GPU)
    runs-on: ubuntu-latest

    steps:
      # 1) Télécharge le code du dépôt sur la machine
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2) Installe Python 3.12 (même version qu'en local).
      #    "cache: pip" garde les paquets téléchargés en mémoire pour que
      #    les prochaines exécutions soient plus rapides.
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 3) Installe les dépendances de test (pas requirements-ml.txt : torch
      #    est trop lourd et inutile pour ces tests)
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4) Lance les tests et mesure la couverture.
      #    Si un test échoue, cette étape devient rouge et la CI échoue.
      - name: Lancer les tests
        run: python -m pytest -q --cov=modules --cov-report=term --cov-report=xml

      # 5) Garde le rapport de couverture téléchargeable depuis GitHub
      #    (même si les tests ont échoué : "if: always()")
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: coverage.xml