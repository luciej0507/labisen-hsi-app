[client]
# Désactive le menu de navigation automatique dans la sidebar.
# On construit à la place un menu horizontal maison (voir modules/topnav.py).
showSidebarNavigation = false

# Masque les options développeur (bouton Deploy, menu ...) du bandeau
# natif de Streamlit. Ce bandeau reste sinon nécessaire : c'est lui qui
# affiche le bouton pour replier ou rouvrir la sidebar.
toolbarMode = "minimal"

[theme]
# Couleur d'accent principale (rouge), reprise dans le menu horizontal
# et appliquée automatiquement aux boutons, sliders et liens Streamlit.
primaryColor = "#C8102E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#262730"
font = "sans serif"